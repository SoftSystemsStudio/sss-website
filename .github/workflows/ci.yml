name: Core CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '8.11.0'

jobs:
  ci:
    name: Build, Typecheck, Lint, Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm -w -r build

      - name: Lint
        run: pnpm lint

      - name: Typecheck @softsystems/ui-components
        run: pnpm --filter @softsystems/ui-components run typecheck

      # Browser smoke tests (packages/frontend/e2e) against the build above,
      # served by `next start`. Browsers are cached per Playwright version;
      # --with-deps still installs the OS libraries on a cache hit.
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter frontend exec playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        run: pnpm --filter frontend exec playwright install --with-deps chromium

      - name: Smoke tests (frontend)
        run: pnpm --filter frontend test:e2e

      # Lighthouse on the built site (2026-11-09). Warnings only for now:
      # scores print in the log and the HTML reports are uploaded; nothing
      # fails the build until we've seen a few runs' baseline.
      - name: Lighthouse (frontend)
        working-directory: packages/frontend
        run: npx --yes @lhci/cli@0.14.0 autorun

      - name: Upload Lighthouse report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: packages/frontend/lighthouse-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            packages/frontend/playwright-report/
            packages/frontend/test-results/
          retention-days: 14
