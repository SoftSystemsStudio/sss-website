# Keeps dependencies current without a flood of PRs. Once a month: one grouped
# PR for every minor and patch update, and one for the GitHub Actions used by
# the workflows. Major versions get a PR each, because they can break things
# and deserve their own review. CI runs on every one of these PRs like any other.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types: [minor, patch]

    # Major upgrades that need real migration work, not a version bump (triaged
    # 2026-11-09). Do one on its own chore/ branch, then delete its entry here.
    # @types/node is held because types should match the Node runtime (24).
    # React 19 must move react and react-dom together, with Next.js checks.
    ignore:
      - dependency-name: 'tailwindcss'
        update-types: ['version-update:semver-major']
      - dependency-name: '@sentry/nextjs'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ['*']
